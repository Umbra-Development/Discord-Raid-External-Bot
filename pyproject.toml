[project]
name = "external-app-raider"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rocco A", email = "xXSG.KingXx@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "discord>=2.3.2",
    "json5>=0.15.0",
    "pillow>=12.3.0",
    "textual>=8.2.8",
]

[project.scripts]
external-app-raider = "umbra_bot:main"
external-app-raider-config = "umbra_gui:main"
bot = "umbra_bot:main"
cli = "umbra_tui:main"
gui = "umbra_gui:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["umbra_bot", "umbra_gui", "umbra_tui"]
