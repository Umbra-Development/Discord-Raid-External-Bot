name: Build versioned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.0 or v1.2.0"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Normalize semantic version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or v1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x86_64
            artifact: linux-x86_64
            arch: x86_64
            python_arch: x64
          - os: ubuntu-22.04-arm
            label: Linux ARM64
            artifact: linux-arm64
            arch: arm64
            python_arch: arm64
          - os: windows-latest
            label: Windows x86_64
            artifact: windows-x86_64
            arch: x86_64
            python_arch: x64
          - os: windows-11-arm
            label: Windows ARM64
            artifact: windows-arm64
            arch: arm64
            python_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python_arch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify Tk is available
        run: uv run python -c "import tkinter; print(tkinter.TkVersion)"

      - name: Build one-file executable
        run: uv run python scripts/build_release.py

      - name: Package Linux release
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          mkdir -p release
          chmod +x dist/Umbra
          cp dist/Umbra "release/Umbra-$VERSION-linux-$ARCH"
          tar -czf "release/Umbra-$VERSION-linux-$ARCH.tar.gz" -C dist Umbra

      - name: Package Windows release
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item `
            -Path dist/Umbra.exe `
            -Destination "release/Umbra-$env:VERSION-windows-$env:ARCH.exe"
          Compress-Archive `
            -Path dist/Umbra.exe `
            -DestinationPath "release/Umbra-$env:VERSION-windows-$env:ARCH.zip"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          options=(
            "$RELEASE_TAG"
            release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Umbra $RELEASE_TAG"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            options+=(--prerelease)
          fi
          gh release create "${options[@]}"
